<!-- #region HEAD -->
<!DOCTYPE html>
<html lang="en">
  <head class="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <!-- #endregion -->
  <!-- #region BODY -->
  <body class="body">
    <main class="main">
      <div class="container">
        <div class="insertBar">ToDo List</div>

        <div class="barraPesquisa">
          <form action="">
            <input type="text">
            <button>Add</button>
          </form>
        </div>

        <div class="listBlock">
          <div class="itemsIndiv">
            <!-- aqui cada itemsIndiv indica um item da lista. 
             Então tenho que fazer mais 2 desses.
             Depois tenho que tirar essa lista e substituir por 3 div's, 
             ou forms, 1 pra texto, outro botão pra clicar e um pra excluir-->            
            <ul>
              <li class="items">Item-1</li>
              <li class="items">Item-2</li>
              <li class="items">Item-3</li>
            </ul>            
          </div>
        </div>
      </div>

    </main>

    <script src="script.js"></script>
  </body>

  <!-- #endregion -->

</html>
